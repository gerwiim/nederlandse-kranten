name: Bouw app.js

# Zet app.jsx om naar gewone JavaScript (app.js), zodat de browser geen
# Babel meer hoeft te laden. Draait vanzelf als app.jsx verandert.
on:
  push:
    paths:
      - app.jsx
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-covers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Haal code op
        uses: actions/checkout@v4.2.2

      - name: Bouw app.js
        run: >
          npx --yes esbuild@0.24.0 app.jsx --loader:.jsx=jsx --target=es2018
          --banner:js="// GEGENEREERD uit app.jsx — wijzig app.jsx, dit bestand wordt automatisch opnieuw gebouwd."
          --outfile=app.js

      - name: Controleer app.js
        run: node --check app.js

      - name: Sla app.js op in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --staged --quiet || git commit -m "app.js opnieuw gebouwd uit app.jsx"
          git pull --rebase
          git push

name: Dagelijkse update voorpagina's

on:
  schedule:
    # Tijden in UTC, bewust niet op het hele uur (dan is GitHub het drukst).
    # Elke run haalt alle kranten op; een latere run van dezelfde dag
    # vervangt eerdere covers. GitHub start geplande runs vaak later.
    - cron: '17 4 * * *'  # 05:17 wintertijd / 06:17 zomertijd
    - cron: '17 9 * * *'  # 10:17 wintertijd / 11:17 zomertijd
    - cron: '17 14 * * *'  # 15:17 wintertijd / 16:17 zomertijd — o.a. RD (middagkrant)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-covers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Haal code op
        uses: actions/checkout@v4.2.2

      - name: Installeer Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'

      - name: Installeer dependencies
        run: pip install requests

      - name: Voer update script uit
        run: python fetch_covers.py

      - name: Sla wijzigingen op in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A archive.json covers/
          git diff --staged --quiet || git commit -m "Automatische update voorpagina's $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

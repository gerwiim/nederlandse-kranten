name: Dagelijkse update voorpagina's

on:
  schedule:
    - cron: '0 5 * * *'   # Elke dag om 06:00 Nederlandse tijd (UTC+1)
  workflow_dispatch:        # Knop om handmatig te starten

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Haal code op
        uses: actions/checkout@v4.2.2

      - name: Installeer Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'

      - name: Installeer dependencies
        run: pip install requests

      - name: Voer update script uit
        run: python fetch_covers.py

      - name: Sla wijzigingen op in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --staged --quiet || git commit -m "Automatische update voorpagina's $(date +'%Y-%m-%d')"
          git push

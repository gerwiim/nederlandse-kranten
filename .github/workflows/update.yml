name: Dagelijkse update voorpagina's

on:
  schedule:
    - cron: '0 4 * * *'   # 06:00 zomertijd — NRC en Telegraaf
    - cron: '0 9 * * *'   # 11:00 zomertijd — DPG-kranten en RD
  workflow_dispatch:        # Knop om handmatig te starten

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Haal code op
        uses: actions/checkout@v4.2.2

      - name: Installeer Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'

      - name: Installeer dependencies
        run: pip install requests
      - name: Debug app.js
        run: python -c "
        import re
        with open('app.js', 'r') as f:
        appjs = f.read()
        match = re.search(r'naam:\s*\"NRC\".{0,200}', appjs, flags=re.DOTALL)
        print(repr(match.group(0)) if match else 'NRC niet gevonden')
        "
      - name: Voer update script uit
        run: python fetch_covers.py

      - name: Sla wijzigingen op in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --staged --quiet || git commit -m "Automatische update voorpagina's $(date +'%Y-%m-%d %H:%M')"
          git push
